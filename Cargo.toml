[package]
name = "archer"
version = "0.1.0"
description = "HTTP Client"
authors = ["phantomreactor <pujari.mahi.mahesh@gmail.com>"]
license = "MIT"
edition = "2024"

[dependencies]
crossterm = { version = "0.28.1", features = ["event-stream"] }
futures = "0.3.31"
ratatui = "0.29.0"
tokio = { version = "1.40.0", features = ["full"] }
color-eyre = "0.6.3"
tui-textarea = "*"
edtui = "0.9.6"
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
ratatui-image = "8.0.1"
image = "0.25"
